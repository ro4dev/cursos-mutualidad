<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #efe7d4;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-la-escena-primero"
        class="scene"
        data-composition-id="01-la-escena-primero"
        data-composition-src="compositions/frames/01-la-escena-primero.html"
        data-start="0"
        data-duration="15"
        data-track-index="0"
      ></div>

      <div
        id="el-02-lo-que-si-y-lo-que-no"
        class="scene"
        data-composition-id="02-lo-que-si-y-lo-que-no"
        data-composition-src="compositions/frames/02-lo-que-si-y-lo-que-no.html"
        data-start="15"
        data-duration="15"
        data-track-index="1"
      ></div>

      <div
        id="el-03-los-tres-pasos"
        class="scene"
        data-composition-id="03-los-tres-pasos"
        data-composition-src="compositions/frames/03-los-tres-pasos.html"
        data-start="30"
        data-duration="15.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-sin-abandonar"
        class="scene"
        data-composition-id="04-sin-abandonar"
        data-composition-src="compositions/frames/04-sin-abandonar.html"
        data-start="45"
        data-duration="15"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-03-los-tres-pasos", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 45);
        tl.fromTo("#el-04-sin-abandonar", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 45);
        tl.addLabel("hf:transition:03-los-tres-pasos:04-sin-abandonar:crossfade", 45);
        tl.to({}, { duration: 60 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
