<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #efe7d4;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-viene-de-la-organizacion"
        class="scene"
        data-composition-id="01-viene-de-la-organizacion"
        data-composition-src="compositions/frames/01-viene-de-la-organizacion.html"
        data-start="0"
        data-duration="12"
        data-track-index="0"
      ></div>

      <div
        id="el-02-los-cuatro-factores"
        class="scene"
        data-composition-id="02-los-cuatro-factores"
        data-composition-src="compositions/frames/02-los-cuatro-factores.html"
        data-start="12"
        data-duration="12"
        data-track-index="1"
      ></div>

      <div
        id="el-03-causa-o-efecto"
        class="scene"
        data-composition-id="03-causa-o-efecto"
        data-composition-src="compositions/frames/03-causa-o-efecto.html"
        data-start="24"
        data-duration="12"
        data-track-index="0"
      ></div>

      <div
        id="el-04-deteccion-y-apoyo"
        class="scene"
        data-composition-id="04-deteccion-y-apoyo"
        data-composition-src="compositions/frames/04-deteccion-y-apoyo.html"
        data-start="36"
        data-duration="12.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-la-causa-manda"
        class="scene"
        data-composition-id="05-la-causa-manda"
        data-composition-src="compositions/frames/05-la-causa-manda.html"
        data-start="48"
        data-duration="12"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-04-deteccion-y-apoyo", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 48);
        tl.fromTo("#el-05-la-causa-manda", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 48);
        tl.addLabel("hf:transition:04-deteccion-y-apoyo:05-la-causa-manda:crossfade", 48);
        tl.to({}, { duration: 60 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
