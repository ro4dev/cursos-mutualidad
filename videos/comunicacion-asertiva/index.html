<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #efe7d4;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-no-es-callarse"
        class="scene"
        data-composition-id="01-no-es-callarse"
        data-composition-src="compositions/frames/01-no-es-callarse.html"
        data-start="0"
        data-duration="11.25"
        data-track-index="0"
      ></div>

      <div
        id="el-02-tres-posturas"
        class="scene"
        data-composition-id="02-tres-posturas"
        data-composition-src="compositions/frames/02-tres-posturas.html"
        data-start="11.25"
        data-duration="11.25"
        data-track-index="1"
      ></div>

      <div
        id="el-03-que-funciona"
        class="scene"
        data-composition-id="03-que-funciona"
        data-composition-src="compositions/frames/03-que-funciona.html"
        data-start="22.5"
        data-duration="11.75"
        data-track-index="0"
      ></div>

      <div
        id="el-04-cuatro-pasos"
        class="scene"
        data-composition-id="04-cuatro-pasos"
        data-composition-src="compositions/frames/04-cuatro-pasos.html"
        data-start="33.75"
        data-duration="11.25"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-03-que-funciona", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 33.75);
        tl.fromTo("#el-04-cuatro-pasos", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 33.75);
        tl.addLabel("hf:transition:03-que-funciona:04-cuatro-pasos:crossfade", 33.75);
        tl.to({}, { duration: 45 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
