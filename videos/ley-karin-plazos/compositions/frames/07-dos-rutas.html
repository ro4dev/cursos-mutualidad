    (function () {
      var q = function (id) { return document.getElementById(id); };

      var wingL = q('07-dos-rutas-wing-l'), wingR = q('07-dos-rutas-wing-r');
      var tiltL = q('07-dos-rutas-tilt-l'), tiltR = q('07-dos-rutas-tilt-r');
      var idleL = q('07-dos-rutas-idle-l'), idleR = q('07-dos-rutas-idle-r');
      var badgeL = q('07-dos-rutas-badge-l'), badgeR = q('07-dos-rutas-badge-r');
      var band = q('07-dos-rutas-band'), bandRule = q('07-dos-rutas-bandrule');
      var line1 = q('07-dos-rutas-line1'), line2 = q('07-dos-rutas-line2');
      var line3 = q('07-dos-rutas-line3'), always = q('07-dos-rutas-always');
      var foot = q('07-dos-rutas-foot'), footRule = q('07-dos-rutas-footrule');

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['07-dos-rutas'] = tl;

      /* --- initial states (applied on build; entrances below are all fromTo) --- */
      tl.set([wingL, wingR, badgeL, badgeR, band, line1, line2, line3, always, foot, footRule],
        { autoAlpha: 0 }, 0);

      /* --- Scene 1 (0.0-1.8s): two cards enter from opposite wings, still FLAT --- */
      tl.fromTo(wingL,
        { x: -420, scale: 0.85, autoAlpha: 0 },
        { x: 0, scale: 1, autoAlpha: 1, duration: 1.15, ease: 'power3.out' }, 0.05);
      tl.fromTo(wingR,
        { x: 420, scale: 0.85, autoAlpha: 0 },
        { x: 0, scale: 1, autoAlpha: 1, duration: 1.15, ease: 'power3.out' }, 0.25);

      /* --- Scene 2 (1.8-3.4s): the mirrored 3D book-open tilt settles them side by side --- */
      tl.fromTo(tiltL, { rotationY: 0 },
        { rotationY: -14, duration: 1.05, ease: 'power3.inOut' }, 1.85);
      tl.fromTo(tiltR, { rotationY: 0 },
        { rotationY: 14, duration: 1.05, ease: 'power3.inOut' }, 2.00);
      /* the pair closes the last of the gap as the pages open */
      tl.to(wingL, { x: -8, duration: 0.9, ease: 'power2.inOut' }, 1.85);
      tl.to(wingR, { x: 8, duration: 0.9, ease: 'power2.inOut' }, 2.00);

      /* --- phase-opposed idle float: left sin(t), right sin(t+PI), never synchronised --- */
      function idleFloat(el, phase) {
        var start = 2.6, span = 6.4, amp = 5, N = 8, kf = [], i;
        for (i = 0; i <= N; i++) {
          kf.push({
            y: Math.sin((i / N) * Math.PI * 2 + phase) * amp,
            duration: span / N,
            ease: 'sine.inOut'
          });
        }
        tl.to(el, { keyframes: kf, duration: span }, start);
      }
      idleFloat(idleL, 0);
      idleFloat(idleR, Math.PI);

      /* --- Scene 3 (3.4-4.8s): the inner-edge badges spring-pop, left then right --- */
      tl.fromTo(badgeL,
        { autoAlpha: 0, scale: 0.2, rotation: -8 },
        { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.62, ease: 'back.out(3.2)' }, 3.50);
      tl.fromTo(badgeR,
        { autoAlpha: 0, scale: 0.2, rotation: -8 },
        { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.62, ease: 'back.out(3.2)' }, 3.86);

      /* --- Scene 4 (4.8-6.6s): the disqualifying rule reveals in layers --- */
      tl.fromTo(bandRule, { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: 'power3.inOut' }, 4.85);
      tl.fromTo(band, { autoAlpha: 0, y: 20 },
        { autoAlpha: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 4.95);
      tl.fromTo(line1, { autoAlpha: 0, y: 14 },
        { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 5.35);
      tl.fromTo(line2, { autoAlpha: 0, y: 14 },
        { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 5.62);
      tl.fromTo(line3, { autoAlpha: 0, y: 14 },
        { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 5.89);
      tl.fromTo(always, { autoAlpha: 0, y: 8 },
        { autoAlpha: 1, y: 0, duration: 0.42, ease: 'power2.out' }, 6.05);

      /* --- Scene 5 (6.6-7.6s): the subcontract footnote --- */
      tl.fromTo(footRule, { autoAlpha: 0, scaleX: 0 },
        { autoAlpha: 1, scaleX: 1, duration: 0.4, ease: 'power2.out', transformOrigin: 'left center' }, 6.62);
      tl.fromTo(foot, { autoAlpha: 0, y: 12 },
        { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 6.78);

      /* --- Scene 6 (7.6-9.0s): held read. No exit — the root transition is the exit. --- */
