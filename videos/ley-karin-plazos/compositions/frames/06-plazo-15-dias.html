    <script>
      (function () {
        "use strict";

        // Ids and class names carry no custom tokens: every selector is an
        // attribute or id selector, so sibling frames cannot collide.
        var byId = function (id) {
          return document.querySelector('[id="' + id + '"]');
        };

        var world = byId("06-plazo-15-dias-world");
        var station4 = byId("06-plazo-15-dias-station-4");
        var support = [
          byId("06-plazo-15-dias-station-1"),
          byId("06-plazo-15-dias-station-2"),
          byId("06-plazo-15-dias-station-3"),
        ];
        var cited = [
          byId("06-plazo-15-dias-art-1"),
          byId("06-plazo-15-dias-art-2"),
          byId("06-plazo-15-dias-art-3"),
        ];
        var counter = byId("06-plazo-15-dias-counter");
        var suffix = document.querySelector(
          '[id="06-plazo-15-dias-counter"] .cu-suffix',
        );
        var card = byId("06-plazo-15-dias-card");
        var steps = [
          byId("06-plazo-15-dias-step-1"),
          byId("06-plazo-15-dias-step-2"),
          byId("06-plazo-15-dias-step-3"),
        ];
        var links = [
          byId("06-plazo-15-dias-link-1"),
          byId("06-plazo-15-dias-link-1-head"),
          byId("06-plazo-15-dias-link-2"),
          byId("06-plazo-15-dias-link-2-head"),
        ];

        // svg-path-draw — dasharray/dashoffset from getTotalLength(), guarded so
        // a host that cannot measure geometry still plays the rest of the frame.
        function armDraw(path) {
          if (!path || typeof path.getTotalLength !== "function") {
            return null;
          }
          var len = path.getTotalLength();
          if (!(len > 0)) {
            return null;
          }
          path.style.strokeDasharray = len;
          path.style.strokeDashoffset = len;
          return len;
        }

        links.forEach(armDraw);

        var tl = gsap.timeline({ paused: true });

        // ── Scene 1 (0.0–1.6s) — the camera arrives at the fourth stop and the
        //    other three drop to a dimmed supporting plane. The mounted count-up
        //    runs its own 0→15 count and lands at 1.72s.
        tl.fromTo(
          world,
          { x: -624 },
          { x: -1136, duration: 1.15, ease: "power2.inOut" },
          0.1,
        );
        tl.fromTo(
          support,
          { opacity: 1 },
          { opacity: 0.34, duration: 1.1, ease: "power2.inOut" },
          0.25,
        );
        tl.fromTo(
          station4,
          { opacity: 0, y: -8 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          0.5,
        );

        // ── Scene 2 (1.6–3.4s) — the unit resolves, then the callout springs
        //    out of the station point: the 15 days only start once the
        //    investigation is closed.
        if (suffix) {
          tl.fromTo(
            suffix,
            { opacity: 0, x: -16 },
            { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
            1.8,
          );
        }
        tl.fromTo(
          card,
          { scale: 0, opacity: 0, y: 24 },
          { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          2.05,
        );

        // ── Scene 3 (3.4–5.2s) — the causal chain resolves left to right. Each
        //    arrow is drawn before the plate it points at lands.
        links.forEach(function (link, index) {
          tl.to(link, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 3.5 + index * 0.16);
        });
        steps.forEach(function (step, index) {
          tl.fromTo(
            step,
            { opacity: 0, x: -22 },
            { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
            3.72 + index * 0.2,
          );
        });

        // ── Scene 4 (5.2–6.8s) — the only retreat in the video. The camera pulls
        //    back far enough to hold all four stops at once, the close reading
        //    ghosts down, and every citation comes up to full so the whole
        //    route lands as a single legible image.
        tl.to(world, { x: -368, duration: 1.2, ease: "power2.inOut" }, 5.3);
        tl.to(support, { opacity: 1, duration: 0.9, ease: "power2.inOut" }, 5.5);
        tl.to([counter, card].concat(steps), { opacity: 0.16, duration: 0.9, ease: "power2.inOut" }, 5.5);
        cited.forEach(function (label, index) {
          tl.fromTo(
            label,
            { opacity: 0 },
            { opacity: 1, duration: 0.6, ease: "power2.out" },
            5.7 + index * 0.08,
          );
        });

        // ── Scene 5 (6.8–10.0s) — the terminal hold. The camera is static and
        //    nothing moves: the route is on screen to be read and re-read.

        // hold the declared 10s window open without an exit tween
        tl.to({}, { duration: 0.01 }, 9.99);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["06-plazo-15-dias"] = tl;
      })();
