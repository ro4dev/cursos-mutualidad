        var dotUp = byId("04-plazo-3-dias-dot-up");
        var dotDown = byId("04-plazo-3-dias-dot-down");
        var routeUp = byId("04-plazo-3-dias-route-up");
        var routeDown = byId("04-plazo-3-dias-route-down");
        var pink = byId("04-plazo-3-dias-pink");

        // svg-path-draw — dasharray/dashoffset from getTotalLength(), guarded so

        function armDraw(path) {
          if (!path || typeof path.getTotalLength !== "function") {
            return null;

          var len = path.getTotalLength();
          if (!(len > 0)) {

          }
          path.style.strokeDasharray = len;
          path.style.strokeDashoffset = len;
          return len;

            { scale: 1, duration: 0.4, ease: "back.out(2.4)" },
